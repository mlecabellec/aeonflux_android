plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt.android)
    id 'pmd'
    id 'checkstyle'
}

pmd {
    toolVersion = '7.0.0'
    ignoreFailures = true
    ruleSetConfig = resources.text.fromFile(rootProject.file('config/pmd/pmd.xml'))
}

task pmdCheck(type: Pmd) {
    description 'Run PMD static code analysis on Java source files'
    group 'verification'
    source 'src/main/java'
    include '**/*.java'
    reports {
        xml.required = true
        html.required = true
    }
}

checkstyle {
    toolVersion = '10.12.5'
    ignoreFailures = true
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
}

task checkstyleCheck(type: Checkstyle) {
    description 'Run Checkstyle static code analysis on Java source files'
    group 'verification'
    source 'src/main/java'
    include '**/*.java'
    classpath = files()
    reports {
        xml.required = true
        html.required = true
    }
}


android {
    namespace 'com.aeonflux.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aeonflux.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout

    // Lifecycle
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata

    // Room
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // Hilt
    implementation libs.hilt.android
    annotationProcessor libs.hilt.compiler

    // WorkManager
    implementation libs.androidx.work.runtime

    // Media3
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.session
    implementation libs.androidx.media3.ui

    // Retrofit / OkHttp
    implementation libs.okhttp
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson

    // Testing
    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
