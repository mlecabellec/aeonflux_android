site_name: AeonFlux Android Documentation
use_directory_urls: false
plugins:
  - search

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
  palette:
    - scheme: slate          # Dark mode (default)
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default        # Light mode
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

nav:
  - Welcome: index.md
  - Topics Index: topics_index.md
  - Project Rules:
      - Rules Index: architecture/rules_index.md
      - "CS-0010 Quality Standards": architecture/CS-0010.md
      - "CS-0020 AI Agent Rules": architecture/CS-0020.md
      - "CS-0030 Java Coding Rules": architecture/CS-0030.md
  - Architecture:
      - Architecture Index: architecture/README.md
  - Governance:
      - Governance Index: governance/README.md
  - Specifications:
      - Specifications Index: specifications/README.md
      - AeonFlux Spec: specifications/aeon_flux.md
  - Project Management:
      - Milestones: project/milestones/README.md
      - Reviews: project/reviews/README.md
      - Tasks:
          - "TSK-20260804-001 Documentation Setup": project/tasks/TSK-20260804-001.md
          - "TSK-20260804-002 Initialize Components": project/tasks/TSK-20260804-002.md
